
workflows:
  android-workflow:
    name: 120 FRAME PRO APK
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Build Debug APK
        script: |
          set -e
          gradle --version
          gradle assembleDebug

    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
