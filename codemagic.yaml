workflows:
  android-workflow:
    name: 120 FRAME PRO APK
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Build Debug APK
        script: |
          set -e
          
          # الانتقال إلى مجلد المشروع الذي تم اكتشافه
          cd PubgUnlocker
          
          # تفعيل خصائص AndroidX تلقائياً لحل المشكلة فوراً
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          gradle --version
          gradle assembleDebug

    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
