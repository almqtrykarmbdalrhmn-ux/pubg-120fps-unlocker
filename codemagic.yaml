workflows:
  android-workflow:
    name: 120 FRAME PRO APK
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Build Debug APK
        script: |
          set -e
          
          # الانتقال تلقائياً إلى المجلد الفرعي الذي يحتوي على ملفات المشروع إذا لم تكن في المجلد الرئيسي
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle*" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ]; then
              echo "Found project in: $SUBDIR"
              cd "$SUBDIR"
            fi
          fi

          gradle --version
          gradle assembleDebug

    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
    
